name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "Download/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Keep the debug signing certificate stable between CI builds so updates do not fail
      # with INSTALL_FAILED_UPDATE_INCOMPATIBLE just because a fresh runner generated a new key.
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: fundniti-debug-signing-key-v1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Place APK in repository Download folder
        run: |
          mkdir -p Download
          cp app/build/outputs/apk/debug/app-debug.apk Download/LoanManager.apk

      - name: Commit APK to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          # Do not publish an APK built from old source if main has newer code.
          if git diff --name-only "$GITHUB_SHA" origin/main | grep -v '^Download/'; then
            echo "Newer source code is already on main; skipping this stale APK. The newer workflow will publish its build."
            exit 0
          fi
          git reset --hard origin/main
          mkdir -p Download
          cp app/build/outputs/apk/debug/app-debug.apk Download/LoanManager.apk
          git add Download/LoanManager.apk
          if git diff --cached --quiet; then
            echo "APK unchanged; no commit needed."
          else
            git commit -m "Build Loan Manager APK"
            git push origin HEAD:main
          fi
