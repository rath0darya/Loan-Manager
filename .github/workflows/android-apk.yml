name: Build and publish FundNiti APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "Download/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: fundniti-debug-signing-key-v1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Prepare versioned release asset
        id: release
        run: |
          version_name="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          short_sha="${GITHUB_SHA::7}"
          release_tag="fundniti-${version_name}-${short_sha}"
          apk_name="FundNiti-${version_name}-${short_sha}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk_name"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "apk=$apk_name" >> "$GITHUB_OUTPUT"
          echo "version=$version_name" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          make_latest: true
          name: FundNiti ${{ steps.release.outputs.version }} (${{ github.sha }})
          body: |
            FundNiti Android app build from commit ${{ github.sha }}.

            Install the attached APK on Android 8.0 (API 26) or later.
          files: ${{ steps.release.outputs.apk }}
          generate_release_notes: true
